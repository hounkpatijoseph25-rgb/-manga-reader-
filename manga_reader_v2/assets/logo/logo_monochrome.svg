<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo « Manga Reader » — variante monochrome (couche « monochrome » de
  l'icône adaptative Android 13+).

  Une seule couleur (blanc) : le système applique ensuite la teinte du thème.
  Les cases de la page avant sont découpées en transparence (masque) pour
  rester lisibles une fois teintées.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 108 108" role="img" aria-label="Manga Reader">
  <defs>
    <mask id="punch">
      <rect x="-18.8" y="-24.45" width="37.6" height="48.9" rx="5.6" fill="#FFFFFF"/>
      <rect x="-14.7" y="-20.35" width="29.4" height="19.6" rx="1.8" fill="#000000"/>
      <rect x="-14.7" y="1.85" width="13.4" height="18.4" rx="1.8" fill="#000000"/>
      <rect x="1.3" y="1.85" width="13.4" height="18.4" rx="1.8" fill="#000000"/>
    </mask>
  </defs>

  <!-- Page arrière : contour seul (pas d'aplat, pour rester net en teinte) -->
  <rect x="-18.8" y="-24.45" width="37.6" height="48.9" rx="5.6"
        fill="none" stroke="#FFFFFF" stroke-width="3"
        transform="translate(48.4 55.3) rotate(-9)"/>

  <!-- Page avant : aplat avec cases évidées -->
  <rect x="-18.8" y="-24.45" width="37.6" height="48.9" rx="5.6"
        fill="#FFFFFF" mask="url(#punch)"
        transform="translate(57.1 54) rotate(7)"/>
</svg>
